name: Daily reel

on:
  schedule:
    - cron: "20 11 * * *"   # 11:20 UTC = 13:20 בשעון חורף בישראל, אחרי הפוסט של 12:47
  workflow_dispatch: {}      # הפעלה ידנית מהלשונית Actions

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        timeout-minutes: 6
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          sudo apt-get $APT update -qq
          sudo apt-get $APT install -y -qq --no-install-recommends ffmpeg fonts-noto-core libraqm0 libfribidi0 libharfbuzz0b
          pip install --quiet pillow
      - name: Make and publish reel
        timeout-minutes: 12
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python make_reel.py
